<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FixPoint</title>
<style>
/* 起動アニメーション: 3つの点 (それぞれのAI) が回りながら中心に集まり、ひとつの点 (合意) になる */
:root{
  --bg:#faf9f6;--text:#1f1e1b;--text2:#5f5e5a;--muted:#8a8984;--tile:#1f1e1b;--ring:#ffffff;
  --dot:#4ec46b;--a:#d97757;--b:#6b8afd;--c:#b58cf0;--track:rgba(0,0,0,.08);--bad:#d64545;
  --sans:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1c1b;--text:#ecebe6;--text2:#b4b2a9;--muted:#888780;--tile:#2c2c2a;--track:rgba(255,255,255,.1);--bad:#f09595;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;user-select:none;cursor:default}
body{display:flex;align-items:center;justify-content:center}
.stage{display:flex;flex-direction:column;align-items:center;transition:transform .55s cubic-bezier(.6,0,.3,1),opacity .45s ease}

/* ロゴ */
svg.logo{width:148px;height:148px;overflow:visible}
.tile{transform-box:view-box;transform-origin:60px 60px;opacity:0;transform:scale(.55) rotate(-12deg);
  animation:tile .75s cubic-bezier(.2,1.3,.4,1) .95s forwards}
.ring{fill:none;stroke:var(--ring);stroke-width:5.5;stroke-linecap:round;stroke-dasharray:132;stroke-dashoffset:132;
  transform-box:view-box;transform-origin:60px 60px;transform:rotate(-90deg);animation:draw .8s cubic-bezier(.65,0,.35,1) 1.15s forwards}
.spin{transform-box:view-box;transform-origin:60px 60px;animation:spin 1.05s cubic-bezier(.55,0,.25,1) forwards}
.orb{transform-box:fill-box;transform-origin:center;animation:fall 1.05s cubic-bezier(.55,0,.25,1) forwards}
.trail{opacity:.28;filter:blur(1.5px)}
.trail .orb{animation-delay:.04s}
.core{fill:var(--dot);transform-box:fill-box;transform-origin:center;transform:scale(0);
  animation:pop .6s cubic-bezier(.2,1.6,.4,1) .98s forwards}
.wave{fill:none;stroke:var(--dot);stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0}
.wave.w1{animation:wave 1s ease-out 1s forwards}
.waiting .wave.w2{animation:wave 1.8s ease-out infinite}
.waiting .wave.w3{animation:wave 1.8s ease-out .9s infinite}
.flash{fill:#fff;transform-box:fill-box;transform-origin:center;opacity:0;animation:flash .5s ease-out .98s}

/* 文字 */
.word{margin-top:26px;font-size:34px;font-weight:700;letter-spacing:.01em;display:flex}
.word span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);animation:rise .6s cubic-bezier(.2,.9,.3,1) forwards}
.tag{margin-top:8px;font-size:13.5px;color:var(--text2);opacity:0;animation:fade .7s ease 1.85s forwards}
.status{margin-top:38px;height:42px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fade .5s ease 2.1s forwards}
.bar{width:180px;height:3px;border-radius:3px;background:var(--track);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:38%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--dot),transparent);
  animation:slide 1.25s cubic-bezier(.45,0,.55,1) infinite}
.msg{font-size:12px;color:var(--muted);min-height:1em;transition:opacity .3s}

/* 準備ができたら: ロゴが手前に寄ってきながら消え、本体の画面に切り替わる */
body.out .stage{transform:scale(1.18);opacity:0}
body.out .status{animation:none;opacity:0;transition:opacity .2s}

/* 起動できなかった */
body.fail .bar i{animation:none;width:100%;background:var(--bad)}
body.fail .core{fill:var(--bad)}
body.fail .wave{animation:none!important;opacity:0}
body.fail .msg{color:var(--bad);max-width:520px;text-align:center;line-height:1.6;user-select:text}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(600deg)}}
@keyframes fall{0%{transform:translateX(78px) scale(1.25);opacity:0}12%{opacity:1}70%{opacity:1}100%{transform:translateX(0) scale(.35);opacity:0}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
@keyframes wave{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(5.2)}}
@keyframes tile{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(270%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="stage">
  <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
    <rect class="tile" x="14" y="14" width="92" height="92" rx="24" fill="var(--tile)"/>
    <circle class="ring" cx="60" cy="60" r="21"/>
    <!-- 3つのAI: 少し遅れてついてくる残像と、本体 -->
    <g class="spin trail">
      <g transform="rotate(0 60 60)"><circle class="orb" cx="60" cy="60" r="6" fill="var(--a)"/></g>
      <g transform="rotate(120 60 60)"><circle class="orb" cx="60" cy="60" r="6" fill="var(--b)"/></g>
      <g transform="rotate(240 60 60)"><circle class="orb" cx="60" cy="60" r="6" fill="var(--c)"/></g>
    </g>
    <g class="spin">
      <g transform="rotate(0 60 60)"><circle class="orb" cx="60" cy="60" r="5.5" fill="var(--a)"/></g>
      <g transform="rotate(120 60 60)"><circle class="orb" cx="60" cy="60" r="5.5" fill="var(--b)"/></g>
      <g transform="rotate(240 60 60)"><circle class="orb" cx="60" cy="60" r="5.5" fill="var(--c)"/></g>
    </g>
    <circle class="wave w1" cx="60" cy="60" r="7"/>
    <circle class="wave w2" cx="60" cy="60" r="7"/>
    <circle class="wave w3" cx="60" cy="60" r="7"/>
    <circle class="flash" cx="60" cy="60" r="7"/>
    <circle class="core" cx="60" cy="60" r="7.5"/>
  </svg>
  <div class="word" id="word"></div>
  <div class="tag">AIたちが「これでいいね」と言うまで</div>
  <div class="status"><div class="bar"><i></i></div><div class="msg" id="msg">起動しています…</div></div>
</div>
<script>
// 文字をひとつずつ浮かび上がらせる
const word = document.getElementById("word");
[..."FixPoint"].forEach((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch;
  s.style.animationDelay = (1.3 + i * 0.055) + "s";
  word.appendChild(s);
});

const T0 = performance.now();
const MIN_SHOW = 2300;  // 起動が速くても、アニメーションは最後まで見せる
const msg = document.getElementById("msg");
let done = false;

setTimeout(() => { if (!done) document.body.classList.add("waiting"); }, 1900);
// なかなか起動しないとき (初回の準備や自動更新)
setTimeout(() => { if (!done) msg.textContent = "準備しています。少し時間がかかることがあります…"; }, 9000);

// アプリ (Rust) から呼ばれる: FixPoint の準備ができた
window.fxReady = (url) => {
  if (done) return;
  done = true;
  const wait = Math.max(0, MIN_SHOW - (performance.now() - T0));
  setTimeout(() => {
    document.body.classList.add("out");
    setTimeout(() => location.replace(url), 480);
  }, wait);
};

// アプリ (Rust) から呼ばれる: 起動できなかった
window.fxFail = (text) => {
  done = true;
  document.body.classList.add("fail");
  msg.textContent = text;
};

// ブラウザで直接開いたとき用のプレビュー (#demo)
if (location.hash === "#demo") setTimeout(() => window.fxReady("#demo"), 0);
</script>
</body>
</html>
